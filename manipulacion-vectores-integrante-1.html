<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios con Vectores Numericos</title>
</head>

<body>

    <h4>Ejercicio con Vectores</h4>

    <div>
        <table>
            <tbody>
                <tr>
                    <td>Dimension del arreglo:</td>
                    <td>
                        <select id="select-dimension-arreglo">
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                            <option value="15">15</option>
                            <option value="20">20</option>
                            <option value="25">25</option>
                            <option value="30">30</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Ingrese valor a buscar:</td>
                    <td>
                        <input type="text"
                               id="id-valor-busqueda"
                               maxlength="4"
                               size="5">
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <br>

    <table id="id-table-vector-numerico"
           border="1"
           cellspacing="1"
           cellpadding="1">

        <thead>
            <tr>
                <td colspan="10">
                    Vector numerico de N elementos
                </td>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>0</td>
                <td>1</td>
                <td>2</td>
                <td>3</td>
                <td>4</td>
                <td>5</td>
                <td>6</td>
                <td>7</td>
                <td>8</td>
                <td>9</td>
            </tr>

            <tr>
                <td>0</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
            </tr>
        </tbody>

        <tfoot>

            <tr>
                <td colspan="5">
                    <button id="btn-cargar-vector">
                        Cargar Vector
                    </button>
                </td>

                <td colspan="5">
                    <button id="btn-vaciar-vector">
                        Vaciar Vector
                    </button>
                </td>
            </tr>

            <tr>
                <td colspan="5">
                    <button id="btn-numero-mayor">
                        Valor Maximo
                    </button>
                </td>

                <td colspan="5">
                    <button id="btn-numero-menor">
                        Valor Minimo
                    </button>
                </td>
            </tr>

            <tr>
                <td colspan="5">
                    <button id="btn-sumar-valores">
                        Suma Total
                    </button>
                </td>

                <td colspan="5">
                    <button id="btn-producto-vector">
                        Producto Total
                    </button>
                </td>
            </tr>

        </tfoot>
    </table>

    <hr>

    <table>
        <thead>
            <tr>
                <td colspan="2" align="center">
                    Calculos con vectores
                </td>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Resultado:</td>
                <td>
                    <input type="text"
                           id="id-txt-respuesta"
                           size="70"
                           readonly>
                </td>
            </tr>
        </tbody>
    </table>

    <script>

        // REFERENCIAS A LOS CONTROLES

        const selectDimension =
            document.getElementById('select-dimension-arreglo')

        const btnCargarVector =
            document.getElementById('btn-cargar-vector')

        const btnVaciarVector =
            document.getElementById('btn-vaciar-vector')

        const btnNumeroMayor =
            document.getElementById('btn-numero-mayor')

        const btnNumeroMenor =
            document.getElementById('btn-numero-menor')

        const btnSumarValores =
            document.getElementById('btn-sumar-valores')

        const btnProductoVector =
            document.getElementById('btn-producto-vector')

        const txtRespuesta =
            document.getElementById('id-txt-respuesta')

        const tableTbody =
            document.querySelector(
                '#id-table-vector-numerico > tbody'
            )


        // CONSTANTES Y VECTOR GLOBAL

        let TOPE = 4

        const NUMERO_MAXIMO_ALEATORIO = 50

        let vectorNumerico = []


        // CAMBIAR DIMENSION

        selectDimension.addEventListener('change', function(e) {

            TOPE = Number(e.target.value)

            vectorNumerico = []

            fnPresentarVector()

            txtRespuesta.value =
                "Dimension cambiada a " + TOPE
        })


        // CARGAR NUMEROS ALEATORIOS

        function fnCargarNumeros() {

            vectorNumerico = []

            for (let i = 0; i < TOPE; i++) {

                const numero = Math.ceil(
                    Math.random() * NUMERO_MAXIMO_ALEATORIO
                )

                vectorNumerico[i] = numero
            }
        }


        // PRESENTAR VECTOR EN TABLA

        function fnPresentarVector() {

            let contador = 0
            let str = ''

            while (contador < 2) {

                str = str + '<tr>'

                for (let x = 0; x < TOPE; x++) {

                    if (contador === 0) {

                        str = str + `<td>${x}</td>`

                    } else {

                        const valor = vectorNumerico[x] ?? 0

                        str = str +
                            `<td>${valor}</td>`
                    }
                }

                str = str + '</tr>'

                contador++
            }

            tableTbody.innerHTML = str

            document.querySelector(
                '#id-table-vector-numerico thead td'
            ).colSpan = TOPE
        }


        // VALIDAR VECTOR VACIO

        function fnValidarVector() {

            if (vectorNumerico.length === 0) {

                txtRespuesta.value =
                    "Error: el vector esta vacio"

                return false
            }

            return true
        }


        // BOTON CARGAR VECTOR

        btnCargarVector.addEventListener('click', function() {

            fnCargarNumeros()

            fnPresentarVector()

            txtRespuesta.value =
                "Vector cargado correctamente"

            console.log(vectorNumerico)
        })


        // BOTON VACIAR VECTOR

        btnVaciarVector.addEventListener('click', function() {

            vectorNumerico = []

            fnPresentarVector()

            txtRespuesta.value =
                "Vector vaciado correctamente"
        })


        // FUNCION BUSCAR NUMERO MAYOR

        function fnBuscarNumeroMayor() {

            let numeroMayor = vectorNumerico[0]
            let posiciones = []

            // Buscar el valor mas alto
            for (let i = 1; i < vectorNumerico.length; i++) {

                if (vectorNumerico[i] > numeroMayor) {

                    numeroMayor = vectorNumerico[i]
                }
            }

            // Encontrar sus posiciones
            for (let i = 0; i < vectorNumerico.length; i++) {

                if (vectorNumerico[i] === numeroMayor) {

                    posiciones.push(i)
                }
            }

            return { numeroMayor, posiciones }
        }


        // BOTON VALOR MAXIMO

        btnNumeroMayor.addEventListener('click', function() {

            if (!fnValidarVector()) return

            const resultado = fnBuscarNumeroMayor()

            txtRespuesta.value =
                "Valor Maximo: " +
                resultado.numeroMayor +
                " (posicion(es): " +
                resultado.posiciones.join(", ") + ")"
        })


        // FUNCION BUSCAR NUMERO MENOR

        function fnBuscarNumeroMenor() {

            let numeroMenor = vectorNumerico[0]
            let posiciones = []

            // Buscar el valor mas bajo
            for (let i = 1; i < vectorNumerico.length; i++) {

                if (vectorNumerico[i] < numeroMenor) {

                    numeroMenor = vectorNumerico[i]
                }
            }

            // Encontrar sus posiciones
            for (let i = 0; i < vectorNumerico.length; i++) {

                if (vectorNumerico[i] === numeroMenor) {

                    posiciones.push(i)
                }
            }

            return { numeroMenor, posiciones }
        }


        // BOTON VALOR MINIMO

        btnNumeroMenor.addEventListener('click', function() {

            if (!fnValidarVector()) return

            const resultado = fnBuscarNumeroMenor()

            txtRespuesta.value =
                "Valor Minimo: " +
                resultado.numeroMenor +
                " (posicion(es): " +
                resultado.posiciones.join(", ") + ")"
        })


        // FUNCION SUMA TOTAL

        function fnSumarValores() {

            let suma = 0

            // Sumar cada elemento del vector
            for (let i = 0; i < vectorNumerico.length; i++) {

                suma = suma + vectorNumerico[i]
            }

            return suma
        }


        // BOTON SUMA TOTAL

        btnSumarValores.addEventListener('click', function() {

            if (!fnValidarVector()) return

            const suma = fnSumarValores()

            txtRespuesta.value =
                "Suma Total: " + suma
        })


        // FUNCION PRODUCTO TOTAL

        function fnProductoValores() {

            let producto = 1

            // Multiplicar todos los elementos
            for (let i = 0; i < vectorNumerico.length; i++) {

                producto =
                    producto * vectorNumerico[i]
            }

            return producto
        }


        // BOTON PRODUCTO TOTAL

        btnProductoVector.addEventListener('click', function() {

            if (!fnValidarVector()) return

            const producto = fnProductoValores()

            // Validar si existe algun cero
            if (vectorNumerico.includes(0)) {

                txtRespuesta.value =
                    "Producto Total: 0 (contiene cero)"

            } else {

                txtRespuesta.value =
                    "Producto Total: " + producto
            }
        })


        // PRESENTAR VECTOR INICIAL

        fnPresentarVector()

    </script>

</body>
</html>
